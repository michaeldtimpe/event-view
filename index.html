<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>event-view</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0a1018; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.point { cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// event-view: current events on a character-grid globe.
// Everything on screen is one grid of monospace cells: the globe, the panels,
// the leader lines. Map data: land.bin + countries.json (tools/build_map.py).
// Events: events.json, re-read every 15 s so it can be edited while the page is open.

const TAU = Math.PI * 2, RAD = Math.PI / 180, DEG = 180 / Math.PI;
const FONT = 'Menlo, "SF Mono", Monaco, "DejaVu Sans Mono", Consolas, monospace';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- palettes ----------
// Color slots; cells store a slot number, each design supplies the hex.
const K = { dim: 1, text: 2, bright: 3, accent: 4, grat: 5, night: 6, land: 7, evt: 12, hover: 13,
            line: 14, panel: 15, selbg: 16, bar: 17, cat: 18, nevt: 27, atmo: 28, bg: 29, nland: 30, water: 35, relief: 36 };
function palette(o) {
  const a = [];
  for (const k in K) if (typeof o[k] === 'string') a[K[k]] = o[k];
  o.land.forEach((c, i) => { a[K.land + i] = c; a[K.nland + i] = o.nland ? o.nland[i] : o.night; });
  o.cat.forEach((c, i) => a[K.cat + i] = c);
  a[K.water] = o.water || o.accent; a[K.relief] = o.relief || o.nevt;
  a[0] = o.text;
  return a;
}
const CAT_NAMES = ['conflict', 'economy', 'finance', 'logistics', 'production', 'space', 'tech', 'politics', 'climate'];
const CAT_TAGS = ['CON', 'ECO', 'FIN', 'LOG', 'PRD', 'SPC', 'TEC', 'POL', 'CLI'];
const STATUS_GLYPH = { live: '●', upcoming: '○', watch: '◇' };

// Themes are independent of the design; each design has a native one.
// political: every country takes one of five hues, no two neighbors alike.
const THEMES = [
  { name: 'AMBER', pal: palette({ water: '#5fb8d6',
      bg: '#120d07', dim: '#80602a', text: '#d9a441', bright: '#ffdf9a', accent: '#7fe3ff', grat: '#3d2c11',
      night: '#7a5a22', land: ['#c98f2a', '#b98224', '#d39a35', '#c08829', '#cf9530'], evt: '#fff1cf',
      hover: '#ffffff', line: '#5a4418', panel: '#1c150b', selbg: '#2c210f', bar: '#1c150b', nevt: '#a8905e', atmo: '#2c200d',
      cat: ['#ff8a75', '#7fe3ff', '#7fe3ff', '#7fe3ff', '#7fe3ff', '#7fe3ff', '#7fe3ff', '#7fe3ff', '#7fe3ff'] }) },
  { name: 'NAVY', pal: palette({ water: '#4f9fd8',
      bg: '#0a1018', dim: '#5d6e84', text: '#b9c6d6', bright: '#f2f6fb', accent: '#ffcf5a', grat: '#22344a',
      night: '#3d5068', land: ['#6f8299', '#8193a8', '#62768f', '#8c9cae', '#586d87'], evt: '#f0b765',
      hover: '#ffffff', line: '#3f546e', panel: '#101a27', selbg: '#1a2a3e', bar: '#111c2a', nevt: '#a07a44', atmo: '#1b2a3d',
      cat: ['#ff6f61', '#f2c14e', '#8fd16a', '#4fc9c0', '#e59a5c', '#b9a0ff', '#6fb1ff', '#f291c7', '#86dcff'] }) },
  { name: 'PAPER', pal: palette({ water: '#2f7fb5',
      bg: '#e6ecee', dim: '#788a93', text: '#2a3b47', bright: '#0c1a24', accent: '#c2371d', grat: '#b4c5cc',
      night: '#8ea4af', land: ['#33566b', '#4d7187', '#25455a', '#5d8094', '#3d6177'], evt: '#c2371d',
      hover: '#000000', line: '#9fb0b9', panel: '#dae3e6', selbg: '#c9d6db', bar: '#d3dde1', nevt: '#d07f70', atmo: '#c5d2d8',
      cat: ['#c2371d', '#a06c00', '#3f7d1f', '#0f7f78', '#a3541a', '#6a45c9', '#1f63c4', '#b53a84', '#1a7fa8'] }) },
  { name: 'ATLAS', political: true, pal: palette({ water: '#59b6ff',
      bg: '#0b1320', dim: '#63748c', text: '#c3cedc', bright: '#ffffff', accent: '#ffe08a', grat: '#1f3048',
      night: '#3d5068', land: ['#e8836a', '#7fc29b', '#f0cf7e', '#74aaf0', '#c893e0'],
      nland: ['#8a5246', '#4d7560', '#8d7b4f', '#47668e', '#765886'], evt: '#ffffff',
      hover: '#ffffff', line: '#3a4e69', panel: '#111c2c', selbg: '#1d2d44', bar: '#111c2c', nevt: '#9aa7b8', atmo: '#182841',
      cat: ['#ff5d52', '#ffe08a', '#b8f08a', '#6fe6dc', '#ffb070', '#d6c2ff', '#9ccbff', '#ffade0', '#b5ecff'] }) },
  { name: 'ATLAS LIGHT', political: true, pal: palette({ water: '#1f6fc0',
      bg: '#f1f3ee', dim: '#7c8780', text: '#2c352f', bright: '#0b120d', accent: '#b3261e', grat: '#c6cec5',
      night: '#a3ada5', land: ['#c8553d', '#2f8a62', '#b0810f', '#2f6fbe', '#8a4fb0'],
      nland: ['#dea193', '#93c2ac', '#d6bd80', '#94b4de', '#c0a2d4'], evt: '#0b120d',
      hover: '#000000', line: '#aab4ab', panel: '#e3e7e0', selbg: '#d2d9d0', bar: '#dde2da', nevt: '#7c8780', atmo: '#d3dad1',
      cat: ['#b3261e', '#7a5600', '#2d6a12', '#0b6b64', '#8a4310', '#5a35b5', '#144fa8', '#9c2a70', '#0f6a8f'] }) },
  { name: 'TERMINAL', pal: palette({ water: '#58c7c0',
      bg: '#050d08', dim: '#3f7a52', text: '#7fd697', bright: '#d6ffe0', accent: '#ffd866', grat: '#12301c',
      night: '#2c5e3c', land: ['#4fb56c', '#45a561', '#5cc079', '#4aac66', '#56ba73'], evt: '#d6ffe0',
      hover: '#ffffff', line: '#235034', panel: '#0a1a10', selbg: '#12301c', bar: '#0a1a10', nevt: '#6f9c7c', atmo: '#0f2616',
      cat: ['#ff7b6b', '#ffd866', '#ffd866', '#ffd866', '#ffd866', '#ffd866', '#ffd866', '#ffd866', '#ffd866'] }) },
];
const DESIGNS = [{ name: 'WIRE', theme: 1 }, { name: 'CHART', theme: 2 }, { name: 'SCOPE', theme: 0 }];

// ---------- state ----------
const store = { get(k, d) { try { const v = localStorage.getItem('ev.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('ev.' + k, JSON.stringify(v)); } catch (e) {} } };
const HASH = location.hash.slice(1).split(':');   // #design[:event-id[:zoom[:theme]]]
const hashDesign = parseInt(HASH[0], 10);
const S = {
  design: hashDesign >= 1 && hashDesign <= 3 ? hashDesign - 1 : 2,
  theme: store.get('theme', -1),          // -1: the design's native theme
  lon: 30, lat: 28, zoom: 1, spin: true, sel: null, fly: null, filter: -1,
  fs: store.get('fs', 13), cities: false, help: false, chooser: location.hash === '#choose',
  news: store.get('news', true),          // false hides every event: pins, cards, labels, tint
  geo: false,                             // rivers and ranges drawn on the map
  states: store.get('states', false),     // US states and Canadian provinces drawn as their own areas
  scaps: store.get('scaps', false),       // their capitals marked
};
let MW = 0, MH = 0, LAND = null, COUNTRIES = [null], CITIES = [];
let WATER = null, RELIEF = null, FW = [null], FR = [null], RIVERS = [];   // seas and lakes, ranges, rivers
const ISLAKE = new Uint8Array(256);
// US states and Canadian provinces ride at the end of COUNTRIES (index SOFF + n),
// so everything that draws, names or lights a country does the same for them.
let STATES = null, SOFF = 0, CAPS = [], STATECAPS = [], showStates = false;
let NAMEU = [], NAMEL = [], byCode = {};
let EVENTS = [], FOCUS = [], UPDATED = '', eventsRaw = '';
let EVC = new Uint8Array(256);          // country index -> has an event under the current filter
let TH = THEMES[0], P = TH.pal;

// ---------- the character grid ----------
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let cols = 0, rows = 0, cw = 8, ch = 16, dpr = 1;
let G_ch, G_fg, G_bg, G_kind, G_riv;    // kind: 1 land, 2 marker; riv: river index + 1
let brFont = '', brSy = 1, brDy = 0;
const hits = [];                        // clickable rectangles, rebuilt every frame
let dirty = true;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = S.fs + 'px ' + FONT;
  cw = ctx.measureText('MMMMMMMMMM').width / 10;
  ch = Math.round(S.fs * 1.3);
  cols = Math.max(40, Math.floor(w / cw)); rows = Math.max(16, Math.floor(h / ch));
  const n = cols * rows;
  G_ch = new Uint16Array(n); G_fg = new Uint8Array(n); G_bg = new Uint8Array(n); G_kind = new Uint8Array(n); G_riv = new Int16Array(n);
  // Braille comes from a fallback font, so scale it until one glyph is one
  // cell wide and its four dot rows fill the cell height.
  const m0 = ctx.measureText('⣿');
  const size = S.fs * cw / (m0.width || cw);
  brFont = size + 'px ' + FONT;
  ctx.font = brFont;
  const m = ctx.measureText('⣿');
  const bw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, bh = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const dot = Math.max(0.5, bw - cw / 2), pitch = (bh - dot) / 3;
  brSy = pitch > 0 ? clamp((ch / 4) / pitch, 0.6, 2.5) : 1;
  brDy = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  ctx.font = S.fs + 'px ' + FONT;
  dirty = true;
}

function clear() { G_ch.fill(32); G_fg.fill(0); G_bg.fill(0); G_kind.fill(0); G_riv.fill(0); hits.length = 0; }
function put(x, y, s, fg, bg) {
  if (y < 0 || y >= rows) return;
  for (let i = 0; i < s.length; i++) {
    const X = x + i; if (X < 0 || X >= cols) continue;
    const k = y * cols + X;
    G_ch[k] = s.charCodeAt(i); G_fg[k] = fg;
    if (bg !== undefined) G_bg[k] = bg;
  }
}
function fill(x, y, w, h, bg) {
  for (let r = Math.max(0, y); r < Math.min(rows, y + h); r++)
    for (let c = Math.max(0, x); c < Math.min(cols, x + w); c++) { const k = r * cols + c; G_ch[k] = 32; G_bg[k] = bg; G_kind[k] = 2; }
}
function box(x, y, w, h, title, fg, bg) {
  fill(x, y, w, h, bg);
  put(x, y, '┌' + '─'.repeat(w - 2) + '┐', fg); put(x, y + h - 1, '└' + '─'.repeat(w - 2) + '┘', fg);
  for (let r = y + 1; r < y + h - 1; r++) { put(x, r, '│', fg); put(x + w - 1, r, '│', fg); }
  if (title) put(x + 2, y, ' ' + title + ' ', K.dim);
}
function wrap(text, width) {
  const out = []; let line = '';
  for (const word of String(text).split(/\s+/)) {
    if (!line.length) line = word;
    else if (line.length + 1 + word.length <= width) line += ' ' + word;
    else { out.push(line); line = word; }
    while (line.length > width) { out.push(line.slice(0, width)); line = line.slice(width); }
  }
  if (line) out.push(line);
  return out;
}
const cut = (s, n) => s.length <= n ? s : s.slice(0, Math.max(0, n - 1)) + '…';

function flush() {
  ctx.fillStyle = P[K.bg]; ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols;) {
      const b = G_bg[y * cols + x]; if (!b) { x++; continue; }
      let n = 1; while (x + n < cols && G_bg[y * cols + x + n] === b) n++;
      ctx.fillStyle = P[b]; ctx.fillRect(Math.floor(x * cw), y * ch, Math.ceil(n * cw), ch);
      x += n;
    }
  }
  ctx.textBaseline = 'middle';
  let anyBraille = false, cur = -1;
  for (let y = 0; y < rows; y++) {
    const base = y * cols, cy = y * ch + ch / 2 + 0.5;
    for (let x = 0; x < cols;) {
      const c = G_ch[base + x];
      if (c === 32 || c === 0) { x++; continue; }
      if (c >= 0x2800 && c <= 0x28FF) { anyBraille = true; x++; continue; }
      const fg = G_fg[base + x];
      if (fg !== cur) { ctx.fillStyle = P[fg] || P[0]; cur = fg; }
      if (c >= 0x2580) {                 // symbols may come from a fallback font: center each in its cell
        ctx.textAlign = 'center'; ctx.fillText(String.fromCharCode(c), x * cw + cw / 2, cy); ctx.textAlign = 'left';
        x++; continue;
      }
      let n = 1;
      while (x + n < cols) { const d = G_ch[base + x + n]; if (d === 32 || d === 0 || d >= 0x2580 || G_fg[base + x + n] !== fg) break; n++; }
      ctx.fillText(String.fromCharCode.apply(null, G_ch.subarray(base + x, base + x + n)), x * cw, cy);
      x += n;
    }
  }
  if (!anyBraille) return;
  ctx.save(); ctx.font = brFont; ctx.textBaseline = 'alphabetic'; ctx.scale(1, brSy); cur = -1;
  for (let y = 0; y < rows; y++) {
    const base = y * cols, cy = (y * ch + ch / 2) / brSy + brDy;
    for (let x = 0; x < cols;) {
      const c = G_ch[base + x];
      if (c < 0x2800 || c > 0x28FF) { x++; continue; }
      const fg = G_fg[base + x];
      if (fg !== cur) { ctx.fillStyle = P[fg] || P[0]; cur = fg; }
      let n = 1;
      while (x + n < cols) { const d = G_ch[base + x + n]; if (d < 0x2800 || d > 0x28FF || G_fg[base + x + n] !== fg) break; n++; }
      ctx.fillText(String.fromCharCode.apply(null, G_ch.subarray(base + x, base + x + n)), x * cw, cy);
      x += n;
    }
  }
  ctx.restore(); ctx.font = S.fs + 'px ' + FONT;
}

// ---------- the globe ----------
// View space: x right, y up, z toward the viewer. World: X = cos(lat)sin(lon),
// Y = sin(lat), Z = cos(lat)cos(lon).
let V = { gx: 0, gy: 0, Rc: 1, Rr: 1, x0: 0, x1: 0, y0: 0, y1: 0 };
let cp = 1, sp = 0, cl = 1, sl = 0, lon0 = 0, sunX = 0, sunY = 0, sunZ = 1;
let oId = 0, oLat = 0, oLon = 0, oDay = true, oW = 0, oR = 0;
// What the quiz has lit, and whether every range is drawn.
const HI = { country: 0, water: 0, relief: 0, river: -1, city: null };
let showRanges = false;
let mouse = { col: -1, row: -1, down: false, moved: false, x: 0, y: 0 };
let hoverId = 0, hoverCity = null, hoverEvent = null, hoverW = 0, hoverR = 0, hoverRiv = 0;

function setView(x0, x1, y0, y1) {
  const Rr = Math.max(3, Math.min((y1 - y0 + 1) / 2 - 1, ((x1 - x0 + 1) / 2 - 2) * cw / ch)) * S.zoom;
  V = { gx: (x0 + x1 + 1) / 2, gy: (y0 + y1 + 1) / 2, Rr, Rc: Rr * ch / cw, x0, x1, y0, y1 };
  const la = S.lat * RAD; lon0 = S.lon * RAD;
  cp = Math.cos(la); sp = Math.sin(la); cl = Math.cos(lon0); sl = Math.sin(lon0);
  // Subsolar point from the clock: good to a degree or two, which is a cell.
  const now = new Date(), y = now.getUTCFullYear();
  const doy = (Date.UTC(y, now.getUTCMonth(), now.getUTCDate()) - Date.UTC(y, 0, 0)) / 864e5;
  const decl = -23.44 * Math.cos(TAU * (doy + 10) / 365) * RAD;
  const slon = -15 * (now.getUTCHours() + now.getUTCMinutes() / 60 - 12) * RAD;
  sunX = Math.cos(decl) * Math.sin(slon); sunY = Math.sin(decl); sunZ = Math.cos(decl) * Math.cos(slon);
}
function samp(nx, ny) {
  const r2 = nx * nx + ny * ny; if (r2 > 1) return false;
  const z = Math.sqrt(1 - r2);
  const y1 = ny * cp + z * sp, z1 = -ny * sp + z * cp;
  const X = nx * cl + z1 * sl, Z = -nx * sl + z1 * cl;
  oLat = Math.asin(y1 > 1 ? 1 : y1 < -1 ? -1 : y1); oLon = Math.atan2(X, Z);
  let ix = ((oLon + Math.PI) / TAU * MW) | 0; if (ix >= MW) ix = MW - 1;
  let iy = ((Math.PI / 2 - oLat) / Math.PI * MH) | 0; if (iy >= MH) iy = MH - 1;
  const i = iy * MW + ix;
  oId = LAND[i]; oW = WATER[i]; oR = RELIEF[i]; oDay = X * sunX + y1 * sunY + Z * sunZ > -0.05;
  if (oW && ISLAKE[oW]) oId = 0;         // a lake is water, whatever country surrounds it
  else if (showStates && oId && STATES[i]) oId = SOFF + STATES[i];
  return true;
}
function project(lat, lon) {
  const la = lat * RAD, dl = lon * RAD - lon0;
  const X = Math.cos(la) * Math.sin(dl), Y = Math.sin(la), Z = Math.cos(la) * Math.cos(dl);
  const x = X, y = Y * cp - Z * sp, z = Y * sp + Z * cp;
  return { z, col: Math.floor(V.gx + x * V.Rc), row: Math.floor(V.gy - y * V.Rr) };
}
function cellGeo(col, row) {             // what is under a cell: sets oId/oLat/oLon
  return samp((col + 0.5 - V.gx) / V.Rc, -(row + 0.5 - V.gy) / V.Rr);
}
function landColor(id) {
  if (id === hoverId || id === HI.country) return K.hover;
  const c = COUNTRIES[id], sh = c.shade % 5;
  if (TH.political) return (oDay ? K.land : K.nland) + sh;
  if (EVC[c.state ? c.pid : id]) return oDay ? K.evt : K.nevt;
  return oDay ? K.land + sh : K.night;
}
function graticule(k, tolLat, tolLon) {
  const la = oLat * DEG, lo = oLon * DEG;
  if (Math.abs(la - 30 * Math.round(la / 30)) < tolLat) { G_ch[k] = Math.abs(la) < 15 ? 0x2D : 0xB7; G_fg[k] = K.grat; }
  else if (Math.abs(lo - 30 * Math.round(lo / 30)) < tolLon / Math.max(0.15, Math.cos(oLat))) { G_ch[k] = 0xB7; G_fg[k] = K.grat; }
}
const Lc = new Int16Array(256), Lr = new Int16Array(256);

function drawGlobe(mode) {
  const { gx, gy, Rc, Rr, x0, x1, y0, y1 } = V;
  const ra = Math.max(y0, Math.floor(gy - Rr) - 1), rb = Math.min(y1, Math.ceil(gy + Rr) + 1);
  const ca = Math.max(x0, Math.floor(gx - Rc) - 2), cb = Math.min(x1, Math.ceil(gx + Rc) + 2);
  const tolLat = DEG / Rr * 0.5, tolLon = DEG / Rc * 0.5;
  if (mode === 'names') for (let i = 1; i < COUNTRIES.length; i++) {
    const p = project(COUNTRIES[i].label[1], COUNTRIES[i].label[0]); Lc[i] = p.col; Lr[i] = p.row;
  }
  for (let row = ra; row <= rb; row++) {
    const ny = -(row + 0.5 - gy) / Rr;
    for (let col = ca; col <= cb; col++) {
      const nx = (col + 0.5 - gx) / Rc, k = row * cols + col;
      if (!samp(nx, ny)) { if (nx * nx + ny * ny < 1.06) { G_ch[k] = 0xB7; G_fg[k] = K.atmo; } continue; }
      if (!oId) {
        if (oW && oW === HI.water) { G_ch[k] = 0x7E; G_fg[k] = K.accent; } else graticule(k, tolLat, tolLon);
        continue;
      }
      G_kind[k] = 1; G_fg[k] = landColor(oId);
      if (oR && (oR === HI.relief || showRanges)) { G_ch[k] = 0x5E; if (oR === HI.relief) G_fg[k] = K.accent; continue; }
      if (mode === 'names') {              // the land spells its own name, anchored to the country
        const s = oDay ? NAMEU[oId] : NAMEL[oId];
        let ph = (col - Lc[oId] + (row - Lr[oId]) * 3) % s.length; if (ph < 0) ph += s.length;
        G_ch[k] = s.charCodeAt(ph);
      } else G_ch[k] = oDay ? 0x23 : 0x3A;   // '#' by day, ':' by night
    }
  }
}

let subIds = new Uint8Array(0);
const BR = [0x01, 0x08, 0x02, 0x10, 0x04, 0x20, 0x40, 0x80];   // dot bits, row-major 2x4
function drawGlobeBraille() {
  const { gx, gy, Rc, Rr, x0, x1, y0, y1 } = V;
  const ra = Math.max(y0, Math.floor(gy - Rr) - 1), rb = Math.min(y1, Math.ceil(gy + Rr) + 1);
  const ca = Math.max(x0, Math.floor(gx - Rc) - 2), cb = Math.min(x1, Math.ceil(gx + Rc) + 2);
  const bw = cb - ca + 1, bh = rb - ra + 1; if (bw <= 0 || bh <= 0) return;
  const sw = bw * 2 + 1, sh = bh * 4 + 1;
  if (subIds.length < sw * sh) subIds = new Uint8Array(sw * sh);
  for (let sy = 0; sy < sh; sy++) {
    const ny = -(ra + sy / 4 + 0.125 - gy) / Rr;
    for (let sx = 0; sx < sw; sx++) subIds[sy * sw + sx] = samp((ca + sx / 2 + 0.25 - gx) / Rc, ny) ? oId : 255;
  }
  const tolLat = DEG / Rr * 0.5, tolLon = DEG / Rc * 0.5;
  for (let r = 0; r < bh; r++) for (let c = 0; c < bw; c++) {
    let bits = 0, cid = 0;
    for (let j = 0; j < 8; j++) {
      const i = (r * 4 + (j >> 1)) * sw + c * 2 + (j & 1), id = subIds[i];
      if (!id || id === 255) continue;

// ---------- events on the globe ----------
function shown(e) { return S.news && (S.filter < 0 || e.cat === S.filter); }

    let g = list.length > 1 ? (list.length > 9 ? '+' : String(list.length)) : STATUS_GLYPH[top.status] || '●';
    if (top.focus && !blink) g = '◎';

function drawRivers(all, target) {

    const k = r * cols + c; if (G_kind[k] === 2) return;

  };

// ---------- design 1: WIRE (callouts pulled out to both margins) ----------
function leader(fromX, y, mc, mr, fg, force) {
  const dir = mc > fromX ? 1 : -1;
  const cell = (x, yy, g) => {
    if (x < V.x0 || x > V.x1 || yy < V.y0 || yy > V.y1) return;
    const k = yy * cols + x;
    if (G_kind[k] === 2 || (!force && G_kind[k] === 1)) return;   // pass behind land unless highlighted
    G_ch[k] = g; G_fg[k] = fg;
  };
  for (let x = fromX; x !== mc; x += dir) cell(x, y, 0x2500);
  if (mr === y) return;
  cell(mc, y, dir > 0 ? (mr > y ? 0x2510 : 0x2518) : (mr > y ? 0x250C : 0x2514));
  for (let yy = Math.min(y, mr) + 1; yy < Math.max(y, mr); yy++) cell(mc, yy, 0x2502);
}
function renderWire() {
  const cwid = clamp(Math.floor(cols * 0.25), 30, 46);
  const narrow = cols < 110;
  setView(narrow ? 0 : cwid + 1, narrow ? cols - 1 : cols - cwid - 2, 1, rows - 2);
  drawGlobe('tint');
  if (S.geo) drawRivers(true, -1);
  const vis = visibleEvents();
  if (!narrow) for (const side of [0, 1]) {
    const mine = vis.filter(v => (v.col < V.gx) === (side === 0)).sort((a, b) => b.pri - a.pri);
    const x = side === 0 ? 1 : cols - cwid, avail = rows - 3;
    let used = 0; const keep = [];
    for (const v of mine) { const h = cardHeight(v.e, cwid - 1) + 1; if (used + h > avail) break; used += h; keep.push(v); }
    keep.sort((a, b) => a.row - b.row || a.col - b.col);
    let y = 2 + Math.floor((avail - used) / 2);
    for (const v of keep) {
      const hot = v.e.id === S.sel || v.e === hoverEvent;
      leader(side === 0 ? cwid : cols - cwid - 1, y, v.col, v.row, hot ? K.bright : v.e.focus ? K.accent : K.line, hot);
      y += drawCard(x, y, cwid - 1, v.e) + 1;
    }
    if (mine.length > keep.length) put(x, rows - 2, '+' + (mine.length - keep.length) + ' more on this side', K.dim);
  }

  drawMarkers(vis);

      put(x, r, s, i === hoverId ? K.bright : K.dim, K.bg);

  if (HASH[1]) { const e = EVENTS.find(v => v.id === HASH[1]); if (e) { select(e); S.lon = e.lon; S.lat = clamp(e.lat, -65, 65); } }
  if (+HASH[2]) S.zoom = clamp(+HASH[2], 0.6, 7);
  if (HASH[3] && +HASH[3] >= 0) S.theme = +HASH[3];
  if (HASH[0] === 'quiz') {              // #quiz[:kinds[:name|find[:answered]]], e.g. #quiz:river,lake:find
    if (HASH[1]) QCATS.forEach(c => Q.cats[c[0]] = HASH[1].split(',').includes(c[0]) ? 1 : 0);
    if (HASH[2]) Q.type = HASH[2];
    quizStart();
    if (HASH[3] && Q.q) { if (Q.type === 'name') grade(true, '', Q.q.correct); else grade(false, 'somewhere else'); }
  }
  if (HASH[0] === 'geo') S.geo = true;
  if (HASH[0] === 'states') { S.states = S.scaps = true; S.news = false; markCountries(); S.lon = -97; S.lat = 50; }
  setInterval(pollEvents, 15000);
  dirty = true;
}

// ---------- loop ----------
let last = performance.now(), lastDraw = 0, holdUntil = 0;
const HOLD_MS = 1200;                    // how long the spin waits after a drag, zoom or arrow key
function tick(t) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  let moving = false;
  if (S.fly) {
    const dl = ((S.fly.lon - S.lon + 540) % 360) - 180, da = S.fly.lat - S.lat, f = Math.min(1, dt * 4);
    S.lon += dl * f; S.lat += da * f; moving = true;
    if (Math.abs(dl) < 0.05 && Math.abs(da) < 0.05) S.fly = null;
  } else if (S.spin && !S.sel && !mouse.down && !S.help && !Q.on && t > holdUntil) {
    S.lon += dt * 1.5; moving = true;       // one turn in four minutes, the surface drifting west to east
  }
  S.lon = ((S.lon + 540) % 360) - 180;
  if (!moving && t - lastDraw < 400 && !dirty) return;   // while turning, draw every frame the browser gives
  if (!moving && !dirty && !FOCUS.length && t - lastDraw < 20000) return;
  lastDraw = t; dirty = false; render();
}
boot(); requestAnimationFrame(tick);
</script>
